name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Number (Leave blank to auto-increment patch)'
        required: false
        type: string
      release_notes:
        description: 'Brief description for the release commit'
        required: false
        type: string
      dry_run:
        description: 'Dry Run (skip actual publishing)'
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Dependabot Security Alerts
        run: |
          alerts=$(gh api repos/${{ github.repository }}/dependabot/alerts --jq '.[] | select(.state=="open") | .number' | wc -l)
          if [ "$alerts" -gt 0 ]; then
            echo "::error::Found $alerts open Dependabot security alerts. Please fix them before publishing."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@Technical-13'

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint
        
      - name: Auto-merge Dependabot PRs
        run: |
          prs=$(gh pr list --author "dependabot[bot]" --json url --limit 10)
          merged=false
          for url in $(echo "${prs}" | jq -r '.[].url'); do
            gh pr review --approve "$url"
            gh pr merge --auto --squash "$url"
            merged=true
          done
          if [ "$merged" = true ]; then git pull origin main; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true 

      - name: Sync Metadata (package.json & README)
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')          
          if [ -z "${{ github.event.inputs.version }}" ]; then
            NEW_VERSION=$(npm version patch --no-git-tag-version)
          else
            NEW_VERSION=v${{ github.event.inputs.version }}
            npm version ${{ github.event.inputs.version }} --no-git-tag-version
          fi          
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); pkg.lastUpdated='$TIMESTAMP'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
          sed -i "s|<!--last_updated-->.*<!--last_updated-->|<!--last_updated-->$TIMESTAMP<!--last_updated-->|g" README.md   
          MSG="${{ github.event.inputs.release_notes }}"
          if [ -z "$MSG" ]; then
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then MSG="Dry run for $NEW_VERSION"
            else MSG="release $NEW_VERSION"; fi
          fi
          echo "FINAL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "COMMIT_MSG=$MSG" >> $GITHUB_ENV

      - name: Update Changelog
        if: github.event.inputs.dry_run != 'true'
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.FINAL_VERSION }}

      - name: Dry Run Publish
        if: github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Package
        if: github.event.inputs.dry_run == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit, Tag, and Push Changes
        if: github.event.inputs.dry_run == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json README.md CHANGELOG.md
          git commit -m "chore: ${{ env.COMMIT_MSG }}"
          git tag ${{ env.FINAL_VERSION }}
          git push origin main --tags
