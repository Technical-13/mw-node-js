name: Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required for posting comments
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        id: eslint
        run: npm run lint
        continue-on-error: true # Let the next step handle the comment

      - name: Post Failure Comment
        if: steps.eslint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## ❌ Linting Failed
            The code in this PR does not match our [Contributing Guidelines](CONTRIBUTING.md).
            Please run `npm run lint:fix` locally or fix the formatting manually to proceed.

      - name: Fail the Build
        if: steps.eslint.outcome == 'failure'
        run: exit 1
